[project]
name = "antifrod"
version = "v0.0.1"
description = ""
authors = [
    { name = "GravyTalk", email = "deneaL123@mail.ru" }
]
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "onnxruntime>=1.24.4",
    "pandas>=3.0.1",
    "pygod>=1.1.0",
    "pyod>=2.0.7",
    "pytod>=0.0.3",
    "pytorch-lifestream>=0.7.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch==2.7.0",
    "torch-geometric>=2.7.0",
    "torchaudio==2.7.0",
    "torchvision==0.22.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "pre-commit>=4.3.0",
    "build>=1.4.0,<2.0.0",
    "twine>=6.2.0,<7.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu118"

[[tool.uv.index]]
name = "simple"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antifrod"]

[tool.hatch.build]
include = [
    "*.yaml",
    "*.toml",
    "*.crt",
]
